<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🀄️ ポップ！ひらがなドンジャラ</title>
    <!-- word.js を読み込む -->
    <script src="word.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Meiryo", sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px 10px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: #ffe066;
            text-shadow: 3px 3px 0px #d35400, -2px -2px 0 #000;
            letter-spacing: 2px;
        }

        .guide-box {
            background: rgba(255, 255, 255, 0.95);
            color: #2c3e50;
            border: 3px solid #f39c12;
            border-radius: 12px;
            padding: 10px 15px;
            max-width: 800px;
            width: 100%;
            margin-bottom: 12px;
            font-size: 0.88rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .guide-title {
            font-weight: bold;
            color: #e67e22;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .game-board {
            width: 100%;
            max-width: 800px;
            aspect-ratio: 1 / 1;
            max-height: 700px;
            background-color: #27ae60;
            border: 12px solid #e67e22;
            border-radius: 24px;
            padding: 15px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.4), 0 12px 25px rgba(0,0,0,0.5);
            display: grid;
            grid-template-rows: 80px 1fr 140px;
            grid-template-columns: 80px 1fr 80px;
            gap: 10px;
            position: relative;
        }

        .player-top { grid-area: 1 / 2 / 2 / 3; display: flex; flex-direction: column; align-items: center; }
        .player-left { grid-area: 2 / 1 / 3 / 2; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .player-right { grid-area: 2 / 3 / 3 / 4; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .player-bottom { grid-area: 3 / 1 / 4 / 4; display: flex; flex-direction: column; align-items: center; }

        .player-tag {
            background: rgba(0, 0, 0, 0.6);
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 4px;
            border: 1px solid #f1c40f;
            color: #fff;
        }
        .player-tag.active {
            background: #f1c40f;
            color: #000;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        .center-table {
            grid-area: 2 / 2 / 3 / 3;
            background: rgba(16, 92, 47, 0.8);
            border: 4px solid #1e824c;
            border-radius: 16px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .deck-info {
            background: #f39c12;
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .discard-grid {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            padding: 5px;
        }
        .discard-zone {
            background: rgba(0,0,0,0.15);
            border-radius: 8px;
            padding: 4px;
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
            align-content: flex-start;
            overflow-y: auto;
        }

        .tile {
            width: 36px;
            height: 50px;
            background: linear-gradient(to bottom, #ffffff 0%, #fff9e6 80%, #f0e3b6 100%);
            border: 1px solid #d4c596;
            border-bottom: 5px solid #d35400;
            border-radius: 6px;
            color: #2c3e50;
            font-weight: 900;
            font-size: 1.3rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
            box-shadow: 1px 2px 4px rgba(0,0,0,0.3);
            transition: transform 0.15s, border 0.15s;
        }
        .tile:active { cursor: grabbing; }
        .tile:hover { transform: translateY(-4px); }
        .tile.selected {
            transform: translateY(-10px);
            border: 2px solid #f1c40f;
            box-shadow: 0 0 10px #f1c40f;
        }
        .tile.back {
            background: linear-gradient(to bottom, #f39c12, #d35400);
            border-bottom: 5px solid #a04000;
            color: transparent;
            cursor: default;
        }
        .tile.small {
            width: 24px;
            height: 34px;
            font-size: 0.9rem;
            border-bottom-width: 3px;
            cursor: default;
        }

        .hand-vertical { display: flex; flex-direction: column; gap: 2px; }
        .hand-horizontal { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }

        .controls { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; justify-content: center; align-items: center; }

        select, button {
            background: linear-gradient(to bottom, #ff7675, #d63031);
            border: 2px solid #fff;
            color: white;
            padding: 8px 12px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.1s;
        }
        select {
            background: #ffffff;
            color: #2c3e50;
            outline: none;
        }
        button:hover { transform: scale(1.05); }
        button:disabled {
            background: #b2bec3;
            border-color: #888;
            cursor: not-allowed;
            transform: none;
        }
        .btn-agari { background: linear-gradient(to bottom, #00b894, #00b894); }

        .message-box {
            background: rgba(0,0,0,0.7);
            color: #ffeaa7;
            padding: 6px 16px;
            border-radius: 15px;
            font-size: 0.92rem;
            font-weight: bold;
            margin-bottom: 6px;
            text-align: center;
        }

        /* モーダル & ローディング */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: #fff;
            color: #333;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            max-width: 680px;
            width: 95%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }
        canvas {
            width: 100%;
            max-width: 620px;
            border-radius: 16px;
            border: 4px solid #f39c12;
            margin: 10px 0;
            background: #f1f2f6;
        }

        .loading-spinner {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 0;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f39c12;
            border-top: 5px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <h1>🀄️ ひらがなドンジャラ</h1>

    <div class="guide-box">
        <div class="guide-title">💡 あがりのルール ＆ 人数設定</div>
        言葉 ＋ 言葉 ＋ ... ＋ 同じ文字2枚（アタマ）で上がり！<br>
        👨‍👩‍👧‍👦 <b>人数選択：</b>1人（vs CPU3体）〜 最大4人（人間同士で対戦）を選択して遊べます！
    </div>

    <div class="message-box" id="message-box">「対局開始」を押すとゲームが始まります！</div>

    <div class="game-board">
        <div class="player-top">
            <div class="player-tag" id="tag-p2">🤖 CPU2</div>
            <div id="hand-p2" class="hand-horizontal"></div>
        </div>
        <div class="player-left">
            <div class="player-tag" id="tag-p1">🤖 CPU1</div>
            <div id="hand-p1" class="hand-vertical"></div>
        </div>
        <div class="center-table">
            <div class="deck-info">山札: <span id="deck-count">0</span> 枚</div>
            <div class="discard-grid">
                <div class="discard-zone" id="discard-p1"></div>
                <div class="discard-zone" id="discard-p2"></div>
                <div class="discard-zone" id="discard-p3"></div>
                <div class="discard-zone" id="discard-p0"></div>
            </div>
        </div>
        <div class="player-right">
            <div class="player-tag" id="tag-p3">🤖 CPU3</div>
            <div id="hand-p3" class="hand-vertical"></div>
        </div>
        <div class="player-bottom">
            <div class="player-tag" id="tag-p0">👤 プレイヤー1</div>
            <div style="display:flex; align-items:center; gap: 15px;">
                <div id="hand-active" class="hand-horizontal"></div>
                <div id="tsumo-active"></div>
            </div>
            <div class="controls">
                <label style="color:#ffeaa7; font-size:0.85rem; font-weight:bold;">人間人数:
                    <select id="select-human-count">
                        <option value="1">1人 (vs CPU3体)</option>
                        <option value="2">2人 (人間2+CPU2)</option>
                        <option value="3">3人 (人間3+CPU1)</option>
                        <option value="4">4人 (人間4人対戦)</option>
                    </select>
                </label>
                <button id="btn-start" onclick="startGame()">対局開始</button>
                <button id="btn-discard" onclick="discardSelected()" disabled>打牌（捨てる）</button>
                <button id="btn-sort" onclick="sortHand()" disabled>理牌（並べる）</button>
                <button id="btn-agari" class="btn-agari" onclick="checkAgari(true)" disabled>アガリ！</button>
            </div>
        </div>
    </div>

    <!-- 記念イラスト表示モーダル -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <h2 id="modal-title" style="color: #e67e22;">🎉 おめでとうございます！</h2>
            
            <div id="loading-box" class="loading-spinner">
                <div class="spinner"></div>
                <p style="font-weight:bold; color:#d35400;" id="loading-text">🎨 言葉（動物・アイテム）のイラストを描いています...<br><small style="color:#7f8c8d;">(数秒お待ちください)</small></p>
            </div>

            <canvas id="memorial-canvas" width="640" height="460" style="display:none;"></canvas>
            <br>
            <div id="modal-buttons" style="display:none;">
                <button onclick="downloadCanvas()">🖼️ 記念イラストカードを保存</button>
                <button onclick="closeModal()" style="background:#7f8c8d;">閉じる</button>
            </div>
        </div>
    </div>

    <script>
        const HIRAGANA_LIST = [
            'あ','い','う','え','お','か','き','く','け','こ',
            'さ','し','す','せ','そ','た','ち','つ','て','と',
            'な','に','ぬ','ね','の','は','ひ','ふ','へ','ほ',
            'ま','み','む','め','も','や','ゆ','よ','ら','り',
            'る','れ','ろ','わ','ん'
        ];

        // AI画像プロンプト変換用単語辞書（明確な動物・物体として指定）
        const WORD_ENGLISH_MAP = {
            'さる': 'an adorable monkey animal', 
            'きじ': 'a colorful pheasant bird', 
            'らいおん': 'a majestic lion animal',
            'ねこ': 'a fluffy cute cat animal', 
            'いぬ': 'a friendly dog animal', 
            'さかな': 'a bright swimming fish',
            'くま': 'a cute bear animal', 
            'うさぎ': 'a fluffy rabbit animal', 
            'すいか': 'a fresh juicy watermelon fruit',
            'あいす': 'a delicious ice cream dessert', 
            'りんご': 'a red shiny apple fruit', 
            'くるま': 'a cool toy car vehicle',
            'とり': 'a pretty bird', 
            'きつね': 'a cute fox animal', 
            'たぬき': 'a cute raccoon dog animal',
            'ぺんぎん': 'a cute penguin bird', 
            'ぱんだ': 'a panda bear animal', 
            'ぞう': 'a friendly elephant animal'
        };

        // 人物排除＆アイテム・動物主体のプロンプト構成
        const COMPOSITIONS = [
            'wide shot perspective, vibrant composition',
            'dynamic center focus on the subjects',
            'playful layout, surrounded by glowing elements',
            'top-down overview, colorful flat lay design',
            'cinematic scene, balanced art layout'
        ];

        const BACKGROUNDS = [
            'a magical starry night sky with shimmering lights',
            'a lush fantasy nature scene under soft golden sunlight',
            'a dreamlike sky full of floating colorful balloons and clouds',
            'a vibrant fantasy land made of sweets and candy',
            'a cheerful bright background with confetti and ribbons',
            'a peaceful nature meadow with colorful flowers'
        ];

        const STYLES = [
            'vibrant 3D animated style',
            'charming watercolor picture book illustration',
            'bright pop-art digital artwork',
            'soft pastel art style with cute details',
            '3D miniature diorama style'
        ];

        let deck = [];
        let players = [];
        let turn = 0;
        let selectedIndex = null;
        let isTsumoSelected = false;
        let isGameOver = false;
        let dragSourceIndex = null;

        function shuffle(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (typeof DICTIONARY !== 'undefined' && DICTIONARY.length > 0) {
                setMessage(`単語辞書（${DICTIONARY.length}語）ロード完了！「対局開始」を押してください。`);
            } else {
                setMessage('⚠️ word.js が読み込めていません。');
            }
        });

        function startGame() {
            if (typeof DICTIONARY === 'undefined' || DICTIONARY.length === 0) return;

            const humanCount = parseInt(document.getElementById('select-human-count').value, 10);

            players = [
                { id: 0, name: 'プレイヤー1', hand: [], tsumo: null, discards: [], isCpu: false },
                { id: 1, name: humanCount >= 2 ? 'プレイヤー2' : 'CPU1', hand: [], tsumo: null, discards: [], isCpu: humanCount < 2 },
                { id: 2, name: humanCount >= 3 ? 'プレイヤー3' : 'CPU2', hand: [], tsumo: null, discards: [], isCpu: humanCount < 3 },
                { id: 3, name: humanCount >= 4 ? 'プレイヤー4' : 'CPU3', hand: [], tsumo: null, discards: [], isCpu: humanCount < 4 }
            ];

            let allTiles = [];
            HIRAGANA_LIST.forEach(char => {
                allTiles.push(char, char);
                if (['あ','い','う','え','お','か','き','く','し','て','と','り','ん','は','つ','ま'].includes(char)) {
                    allTiles.push(char);
                }
            });

            deck = shuffle(allTiles).slice(0, 100);
            isGameOver = false;

            players.forEach(p => {
                p.hand = deck.splice(0, 10);
                p.tsumo = null;
                p.discards = [];
            });

            turn = 0;
            selectedIndex = null;
            isTsumoSelected = false;

            document.getElementById('btn-start').innerText = 'やり直す';
            document.getElementById('btn-sort').disabled = false;
            document.getElementById('btn-agari').disabled = false;

            setMessage(`対局開始！（${humanCount}人プレイ） 最初の順番は ${players[0].name} です。`);
            startTurn();
        }

        function startTurn() {
            if (deck.length === 0) {
                setMessage('山札が無くなりました！流局です。');
                isGameOver = true;
                updateUI();
                return;
            }

            const currentPlayer = players[turn];
            currentPlayer.tsumo = deck.pop();
            selectedIndex = null;
            isTsumoSelected = false;
            updateUI();

            if (currentPlayer.isCpu) {
                setMessage(`${currentPlayer.name} の思考中...`);
                setTimeout(() => cpuPlay(currentPlayer), 1000);
            } else {
                setMessage(`【${currentPlayer.name} の番】 捨てる牌を選んで「打牌」してください。`);
            }
        }

        function cpuPlay(cpu) {
            const agariResult = checkAgariLogic([...cpu.hand, cpu.tsumo]);
            if (agariResult) {
                setMessage(`🎉 ${cpu.name} がアガりました！`);
                isGameOver = true;
                updateUI();
                showMemorialModal(agariResult.words, agariResult.head, cpu.name);
                return;
            }

            const discardFromHand = Math.random() < 0.7;
            if (discardFromHand) {
                const idx = Math.floor(Math.random() * cpu.hand.length);
                const discarded = cpu.hand[idx];
                cpu.hand[idx] = cpu.tsumo;
                cpu.discards.push(discarded);
            } else {
                cpu.discards.push(cpu.tsumo);
            }
            cpu.tsumo = null;

            nextTurn();
        }

        function nextTurn() {
            turn = (turn + 1) % 4;
            startTurn();
        }

        function handleTileClick(index) {
            if (isGameOver || players[turn].isCpu) return;
            const p = players[turn];

            if (isTsumoSelected) {
                const temp = p.hand[index];
                p.hand[index] = p.tsumo;
                p.tsumo = temp;
                isTsumoSelected = false;
                selectedIndex = null;
                updateUI();
                return;
            }

            if (selectedIndex !== null && selectedIndex !== index) {
                const temp = p.hand[selectedIndex];
                p.hand[selectedIndex] = p.hand[index];
                p.hand[index] = temp;
                selectedIndex = null;
                updateUI();
                return;
            }

            if (selectedIndex === index) {
                selectedIndex = null;
            } else {
                selectedIndex = index;
            }
            isTsumoSelected = false;
            updateUI();
        }

        function handleTsumoClick() {
            if (isGameOver || players[turn].isCpu) return;
            const p = players[turn];
            if (selectedIndex !== null) {
                const temp = p.hand[selectedIndex];
                p.hand[selectedIndex] = p.tsumo;
                p.tsumo = temp;
                selectedIndex = null;
                isTsumoSelected = false;
            } else {
                isTsumoSelected = !isTsumoSelected;
            }
            updateUI();
        }

        function handleDragStart(e, index) {
            dragSourceIndex = index;
            e.dataTransfer.setData('text/plain', index);
        }

        function handleDragOver(e) { e.preventDefault(); }

        function handleDrop(e, targetIndex) {
            e.preventDefault();
            if (dragSourceIndex === null || dragSourceIndex === targetIndex || players[turn].isCpu) return;
            const p = players[turn];
            const temp = p.hand[dragSourceIndex];
            p.hand[dragSourceIndex] = p.hand[targetIndex];
            p.hand[targetIndex] = temp;
            dragSourceIndex = null;
            selectedIndex = null;
            updateUI();
        }

        function discardSelected() {
            const p = players[turn];
            if (p.isCpu || isGameOver) return;

            if (isTsumoSelected) {
                p.discards.push(p.tsumo);
                p.tsumo = null;
            } else if (selectedIndex !== null) {
                p.discards.push(p.hand[selectedIndex]);
                p.hand[selectedIndex] = p.tsumo;
                p.tsumo = null;
            } else {
                setMessage('捨てる牌を選択してください！');
                return;
            }

            selectedIndex = null;
            isTsumoSelected = false;
            nextTurn();
        }

        function sortHand() {
            const p = players[turn];
            if (p.isCpu || isGameOver) return;
            p.hand.sort((a, b) => HIRAGANA_LIST.indexOf(a) - HIRAGANA_LIST.indexOf(b));
            selectedIndex = null;
            updateUI();
        }

        function checkAgari(isManual = false) {
            const p = players[turn];
            if (p.isCpu) return;

            const allChars = [...p.hand];
            if (p.tsumo) allChars.push(p.tsumo);

            const result = checkAgariLogic(allChars);

            if (result) {
                setMessage(`🎉 ${p.name} がアガりました！！ 完成言葉：${result.words.join(' / ')}`);
                isGameOver = true;
                showMemorialModal(result.words, result.head, p.name);
            } else if (isManual) {
                setMessage('❌ まだアガリの形（言葉＋言葉...＋同じ文字2枚）になっていません！');
            }
        }

        function checkAgariLogic(allChars) {
            if (allChars.length < 11) return null;

            const charCounts = {};
            allChars.forEach(c => charCounts[c] = (charCounts[c] || 0) + 1);

            const headCandidates = Object.keys(charCounts).filter(char => charCounts[char] >= 2);

            for (let head of headCandidates) {
                const tempCounts = { ...charCounts };
                tempCounts[head] -= 2;

                const words = findWords(tempCounts);
                if (words !== null) {
                    return { head, words };
                }
            }
            return null;
        }

        function findWords(counts) {
            const remainingCount = Object.values(counts).reduce((a, b) => a + b, 0);
            if (remainingCount === 0) return [];

            for (let word of DICTIONARY) {
                if (word.length > remainingCount) continue;

                let canForm = true;
                let tempMap = { ...counts };

                for (let char of word) {
                    if (!tempMap[char] || tempMap[char] <= 0) {
                        canForm = false;
                        break;
                    }
                    tempMap[char]--;
                }

                if (canForm) {
                    const subResult = findWords(tempMap);
                    if (subResult !== null) {
                        return [word, ...subResult];
                    }
                }
            }
            return null;
        }

        function updateUI() {
            document.getElementById('deck-count').innerText = deck.length;

            if (players.length === 0) return;

            for (let i = 0; i < 4; i++) {
                const tagEl = document.getElementById(`tag-p${i}`);
                const player = players[i];
                tagEl.innerText = `${player.isCpu ? '🤖' : '👤'} ${player.name}`;
                if (turn === i && !isGameOver) tagEl.classList.add('active');
                else tagEl.classList.remove('active');
            }

            [1, 2, 3].forEach(id => {
                const player = players[id];
                const handDiv = document.getElementById(`hand-p${id}`);
                handDiv.innerHTML = '';
                player.hand.forEach(() => {
                    const tile = document.createElement('div');
                    tile.className = 'tile back small';
                    handDiv.appendChild(tile);
                });
                if (player.tsumo) {
                    const tile = document.createElement('div');
                    tile.className = 'tile back small';
                    handDiv.appendChild(tile);
                }
            });

            const activePlayer = players[turn];
            const p0Tag = document.getElementById('tag-p0');
            p0Tag.innerText = `${activePlayer.isCpu ? '🤖' : '👤'} 操作中: ${activePlayer.name}`;

            const activeHandDiv = document.getElementById('hand-active');
            activeHandDiv.innerHTML = '';

            if (!activePlayer.isCpu) {
                activePlayer.hand.forEach((char, idx) => {
                    const tile = document.createElement('div');
                    tile.className = `tile ${selectedIndex === idx ? 'selected' : ''}`;
                    tile.innerText = char;
                    tile.draggable = true;
                    tile.onclick = () => handleTileClick(idx);
                    tile.ondragstart = (e) => handleDragStart(e, idx);
                    tile.ondragover = (e) => handleDragOver(e);
                    tile.ondrop = (e) => handleDrop(e, idx);
                    activeHandDiv.appendChild(tile);
                });
            } else {
                activePlayer.hand.forEach(() => {
                    const tile = document.createElement('div');
                    tile.className = 'tile back';
                    activeHandDiv.appendChild(tile);
                });
            }

            const activeTsumoDiv = document.getElementById('tsumo-active');
            activeTsumoDiv.innerHTML = '';
            if (activePlayer.tsumo) {
                const tile = document.createElement('div');
                if (!activePlayer.isCpu) {
                    tile.className = `tile ${isTsumoSelected ? 'selected' : ''}`;
                    tile.innerText = activePlayer.tsumo;
                    tile.onclick = handleTsumoClick;
                } else {
                    tile.className = 'tile back';
                }
                activeTsumoDiv.appendChild(tile);
            }

            players.forEach((player, idx) => {
                const zone = document.getElementById(`discard-p${idx}`);
                zone.innerHTML = '';
                player.discards.forEach(char => {
                    const tile = document.createElement('div');
                    tile.className = 'tile small';
                    tile.innerText = char;
                    zone.appendChild(tile);
                });
            });

            document.getElementById('btn-discard').disabled = (activePlayer.isCpu || activePlayer.tsumo === null || (selectedIndex === null && !isTsumoSelected) || isGameOver);
        }

        function setMessage(msg) {
            document.getElementById('message-box').innerText = msg;
        }

        // --- 🎨 人間（女性キャラ）の発生をブロックし、単語主体で描画 ---
        async function showMemorialModal(words, head, winnerName) {
            const modal = document.getElementById('modal');
            const loadingBox = document.getElementById('loading-box');
            const canvas = document.getElementById('memorial-canvas');
            const buttons = document.getElementById('modal-buttons');

            document.getElementById('modal-title').innerText = `🎉 ${winnerName} の大勝利！`;
            modal.style.display = 'flex';
            loadingBox.style.display = 'flex';
            canvas.style.display = 'none';
            buttons.style.display = 'none';

            const randomComp = COMPOSITIONS[Math.floor(Math.random() * COMPOSITIONS.length)];
            const randomBg = BACKGROUNDS[Math.floor(Math.random() * BACKGROUNDS.length)];
            const randomStyle = STYLES[Math.floor(Math.random() * STYLES.length)];

            const englishSubjects = words.map(w => WORD_ENGLISH_MAP[w] || w).join(' and ');

            // 人間・女の子・人物を強力ブロック指定（no humans, no person, no girls）
            const promptText = `A high quality ${randomStyle} featuring ${englishSubjects}, ${randomComp}, set in ${randomBg}, no humans, no person, no girls, clear focus on the items and animals, masterpiece`;
            const encodedPrompt = encodeURIComponent(promptText);
            
            const randomSeed = Math.floor(Math.random() * 999999);
            const aiImageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=600&height=320&nologo=true&seed=${randomSeed}`;

            try {
                const response = await fetch(aiImageUrl);
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);

                const img = new Image();
                img.src = blobUrl;
                img.onload = () => {
                    const ctx = canvas.getContext('2d');

                    // カード土台
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, 640, 460);

                    // AI画像描画
                    ctx.drawImage(img, 20, 75, 600, 320);

                    // ヘッダーデザイン
                    const grad = ctx.createLinearGradient(0, 0, 640, 0);
                    grad.addColorStop(0, '#f39c12');
                    grad.addColorStop(1, '#e67e22');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, 640, 65);

                    ctx.fillStyle = '#ffffff';
                    ctx.font = '900 22px "M PLUS Rounded 1c", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(`🀄️ 完成記念カード (${words.join(' / ')})`, 320, 40);

                    // フッターデザイン
                    ctx.fillStyle = '#2c3e50';
                    ctx.fillRect(0, 400, 640, 60);

                    ctx.fillStyle = '#ffeaa7';
                    ctx.font = 'bold 18px sans-serif';
                    ctx.fillText(`🏆 勝者: ${winnerName}  |  言葉: ${words.join(' + ')}  |  ペア: 【${head}${head}】`, 320, 435);

                    ctx.strokeStyle = '#f39c12';
                    ctx.lineWidth = 8;
                    ctx.strokeRect(4, 4, 632, 452);

                    loadingBox.style.display = 'none';
                    canvas.style.display = 'block';
                    buttons.style.display = 'block';
                };
            } catch (err) {
                console.error('画像生成エラー:', err);
                alert('AIイラストの生成に失敗しました。');
                closeModal();
            }
        }

        function downloadCanvas() {
            const canvas = document.getElementById('memorial-canvas');
            const link = document.createElement('a');
            link.download = 'ひらがなドンジャラ_記念カード.png';
            link.href = canvas.toDataURL();
            link.click();
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }
    </script>
</body>
