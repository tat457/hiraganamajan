<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🀄️ ポップ！ひらがなドンジャラ</title>
    <!-- word.js を読み込む -->
    <script src="word.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Meiryo", sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px 10px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: #ffe066;
            text-shadow: 3px 3px 0px #d35400, -2px -2px 0 #000;
            letter-spacing: 2px;
        }

        /* ルールガイド */
        .guide-box {
            background: rgba(255, 255, 255, 0.95);
            color: #2c3e50;
            border: 3px solid #f39c12;
            border-radius: 12px;
            padding: 10px 15px;
            max-width: 800px;
            width: 100%;
            margin-bottom: 12px;
            font-size: 0.88rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .guide-title {
            font-weight: bold;
            color: #e67e22;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .guide-example {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 5px;
            flex-wrap: wrap;
        }
        .badge {
            background: #e74c3c;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .badge-head { background: #27ae60; }

        /* ドンジャラ卓 */
        .game-board {
            width: 100%;
            max-width: 800px;
            aspect-ratio: 1 / 1;
            max-height: 700px;
            background-color: #27ae60;
            border: 12px solid #e67e22;
            border-radius: 24px;
            padding: 15px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.4), 0 12px 25px rgba(0,0,0,0.5);
            display: grid;
            grid-template-rows: 80px 1fr 140px;
            grid-template-columns: 80px 1fr 80px;
            gap: 10px;
            position: relative;
        }

        .player-top { grid-area: 1 / 2 / 2 / 3; display: flex; flex-direction: column; align-items: center; }
        .player-left { grid-area: 2 / 1 / 3 / 2; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .player-right { grid-area: 2 / 3 / 3 / 4; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .player-bottom { grid-area: 3 / 1 / 4 / 4; display: flex; flex-direction: column; align-items: center; }

        .player-tag {
            background: rgba(0, 0, 0, 0.6);
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 4px;
            border: 1px solid #f1c40f;
        }
        .player-tag.active {
            background: #f1c40f;
            color: #000;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        .center-table {
            grid-area: 2 / 2 / 3 / 3;
            background: rgba(16, 92, 47, 0.8);
            border: 4px solid #1e824c;
            border-radius: 16px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .deck-info {
            background: #f39c12;
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .discard-grid {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            padding: 5px;
        }
        .discard-zone {
            background: rgba(0,0,0,0.15);
            border-radius: 8px;
            padding: 4px;
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
            align-content: flex-start;
            overflow-y: auto;
        }

        /* 牌の見た目 */
        .tile {
            width: 36px;
            height: 50px;
            background: linear-gradient(to bottom, #ffffff 0%, #fff9e6 80%, #f0e3b6 100%);
            border: 1px solid #d4c596;
            border-bottom: 5px solid #d35400;
            border-radius: 6px;
            color: #2c3e50;
            font-weight: 900;
            font-size: 1.3rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
            box-shadow: 1px 2px 4px rgba(0,0,0,0.3);
            transition: transform 0.15s, border 0.15s;
        }
        .tile:active { cursor: grabbing; }
        .tile:hover { transform: translateY(-4px); }
        .tile.selected {
            transform: translateY(-10px);
            border: 2px solid #f1c40f;
            box-shadow: 0 0 10px #f1c40f;
        }
        .tile.back {
            background: linear-gradient(to bottom, #f39c12, #d35400);
            border-bottom: 5px solid #a04000;
            color: transparent;
            cursor: default;
        }
        .tile.small {
            width: 24px;
            height: 34px;
            font-size: 0.9rem;
            border-bottom-width: 3px;
            cursor: default;
        }

        .hand-vertical { display: flex; flex-direction: column; gap: 2px; }
        .hand-horizontal { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }

        .controls { display: flex; gap: 8px; margin-top: 8px; }

        button {
            background: linear-gradient(to bottom, #ff7675, #d63031);
            border: 2px solid #fff;
            color: white;
            padding: 8px 16px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.1s;
        }
        button:hover { transform: scale(1.05); }
        button:disabled {
            background: #b2bec3;
            border-color: #888;
            cursor: not-allowed;
            transform: none;
        }
        .btn-agari { background: linear-gradient(to bottom, #00b894, #00b894); }

        .message-box {
            background: rgba(0,0,0,0.7);
            color: #ffeaa7;
            padding: 6px 16px;
            border-radius: 15px;
            font-size: 0.92rem;
            font-weight: bold;
            margin-bottom: 6px;
            text-align: center;
        }

        /* モーダル */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: #fff;
            color: #333;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            max-width: 680px;
            width: 95%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        canvas {
            width: 100%;
            max-width: 620px;
            border-radius: 16px;
            border: 4px solid #f39c12;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <h1>🀄️ ひらがなドンジャラ</h1>

    <div class="guide-box">
        <div class="guide-title">💡 あがりのルール（合計11枚）＆ 操作方法</div>
        言葉 ＋ 言葉 ＋ ... ＋ 同じ文字2枚（アタマ）で上がり！<br>
        🖐️ <b>手牌の並び替え：</b>牌をクリックして別の牌を選ぶか、<b>ドラッグ＆ドロップ</b>で好きな場所に移動できます。
        <div class="guide-example">
            【例】
            <span class="badge">さ る</span>
            <span class="badge">き じ</span>
            <span class="badge">ら い お ん</span>
            <span class="badge badge-head">い い (ペア)</span>
        </div>
    </div>

    <div class="message-box" id="message-box">「対局開始」を押すとゲームが始まります！</div>

    <div class="game-board">
        <!-- 対面 (CPU2) -->
        <div class="player-top">
            <div class="player-tag" id="tag-cpu2">🤖 対面 (CPU2)</div>
            <div id="hand-cpu2" class="hand-horizontal"></div>
        </div>

        <!-- 上家 (CPU1) -->
        <div class="player-left">
            <div class="player-tag" id="tag-cpu1">🤖 上家 (CPU1)</div>
            <div id="hand-cpu1" class="hand-vertical"></div>
        </div>

        <!-- 中央卓 -->
        <div class="center-table">
            <div class="deck-info">山札: <span id="deck-count">0</span> 枚</div>
            <div class="discard-grid">
                <div class="discard-zone" id="discard-cpu1"></div>
                <div class="discard-zone" id="discard-cpu2"></div>
                <div class="discard-zone" id="discard-cpu3"></div>
                <div class="discard-zone" id="discard-player"></div>
            </div>
        </div>

        <!-- 下家 (CPU3) -->
        <div class="player-right">
            <div class="player-tag" id="tag-cpu3">🤖 下家 (CPU3)</div>
            <div id="hand-cpu3" class="hand-vertical"></div>
        </div>

        <!-- プレイヤー (自分) -->
        <div class="player-bottom">
            <div class="player-tag" id="tag-player">👤 あなた</div>
            <div style="display:flex; align-items:center; gap: 15px;">
                <div id="hand-player" class="hand-horizontal"></div>
                <div id="tsumo-player"></div>
            </div>
            <div class="controls">
                <button id="btn-start" onclick="startGame()">対局開始</button>
                <button id="btn-discard" onclick="discardSelected()" disabled>打牌（捨てる）</button>
                <button id="btn-sort" onclick="sortHand()" disabled>理牌（五十音順）</button>
                <button id="btn-agari" class="btn-agari" onclick="checkAgari(true)" disabled>アガリ！</button>
            </div>
        </div>
    </div>

    <!-- 記念イラスト表示モーダル -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <h2 id="modal-title" style="color: #e67e22;">🎉 おめでとうございます！</h2>
            <p id="modal-desc">仲間たちが肩を組んで大喜びしています！</p>
            <canvas id="memorial-canvas" width="640" height="440"></canvas>
            <br>
            <button onclick="downloadCanvas()">🖼️ 記念イラストカードを保存する</button>
            <button onclick="closeModal()" style="background:#7f8c8d;">閉じる</button>
        </div>
    </div>

    <script>
        const HIRAGANA_LIST = [
            'あ','い','う','え','お','か','き','く','け','こ',
            'さ','し','す','せ','そ','た','ち','つ','て','と',
            'な','に','ぬ','ね','の','は','ひ','ふ','へ','ほ',
            'ま','み','む','め','も','や','ゆ','よ','ら','り',
            'る','れ','ろ','わ','ん'
        ];

        // 単語ごとのキャラクター定義（顔・色・名前）
        const CHARACTER_MAP = {
            'さる': { emoji: '🐒', name: 'さる', color: '#e67e22', bodyColor: '#d35400' },
            'きじ': { emoji: '🐦', name: 'きじ', color: '#2980b9', bodyColor: '#16a085' },
            'らいおん': { emoji: '🦁', name: 'らいおん', color: '#f39c12', bodyColor: '#f1c40f' },
            'ねこ': { emoji: '🐱', name: 'ねこ', color: '#e74c3c', bodyColor: '#ff7675' },
            'いぬ': { emoji: '🐶', name: 'いぬ', color: '#d35400', bodyColor: '#e67e22' },
            'さかな': { emoji: '🐟', name: 'さかな', color: '#3498db', bodyColor: '#74b9ff' },
            'くま': { emoji: '🐻', name: 'くま', color: '#8e44ad', bodyColor: '#a29bfe' },
            'うさぎ': { emoji: '🐰', name: 'うさぎ', color: '#fd79a8', bodyColor: '#e84393' },
            'すいか': { emoji: '🍉', name: 'すいか', color: '#2ecc71', bodyColor: '#00b894' },
            'あいす': { emoji: '🍦', name: 'あいす', color: '#74b9ff', bodyColor: '#0984e3' },
            'りんご': { emoji: '🍎', name: 'りんご', color: '#ff7675', bodyColor: '#d63031' },
            'くるま': { emoji: '🚗', name: 'くるま', color: '#e17055', bodyColor: '#d63031' }
        };

        let deck = [];
        let players = [
            { id: 0, name: 'あなた', hand: [], tsumo: null, discards: [], isCpu: false },
            { id: 1, name: 'CPU1', hand: [], tsumo: null, discards: [], isCpu: true },
            { id: 2, name: 'CPU2', hand: [], tsumo: null, discards: [], isCpu: true },
            { id: 3, name: 'CPU3', hand: [], tsumo: null, discards: [], isCpu: true }
        ];
        let turn = 0;
        let selectedIndex = null;
        let isTsumoSelected = false;
        let isGameOver = false;
        let dragSourceIndex = null; // ドラッグ用

        function shuffle(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (typeof DICTIONARY !== 'undefined' && DICTIONARY.length > 0) {
                setMessage(`単語辞書（${DICTIONARY.length}語）ロード完了！「対局開始」を押してください。`);
            } else {
                setMessage('⚠️ word.js が読み込めていません。');
            }
        });

        function startGame() {
            if (typeof DICTIONARY === 'undefined' || DICTIONARY.length === 0) return;

            let allTiles = [];
            HIRAGANA_LIST.forEach(char => {
                allTiles.push(char, char);
                if (['あ','い','う','え','お','か','き','く','し','て','と','り','ん','は','つ','ま'].includes(char)) {
                    allTiles.push(char);
                }
            });

            deck = shuffle(allTiles).slice(0, 100); // 100枚の山札
            isGameOver = false;

            players.forEach(p => {
                p.hand = deck.splice(0, 10);
                p.tsumo = null;
                p.discards = [];
            });

            turn = 0;
            selectedIndex = null;
            isTsumoSelected = false;

            document.getElementById('btn-start').innerText = 'やり直す';
            document.getElementById('btn-sort').disabled = false;
            document.getElementById('btn-agari').disabled = false;

            setMessage('ゲーム開始！手牌はクリックまたはドラッグで自由に並び替えられます。');
            startTurn();
        }

        function startTurn() {
            if (deck.length === 0) {
                setMessage('山札が無くなりました！流局です。');
                isGameOver = true;
                updateUI();
                return;
            }

            const currentPlayer = players[turn];
            currentPlayer.tsumo = deck.pop();
            updateUI();

            if (currentPlayer.isCpu) {
                setMessage(`${currentPlayer.name} の思考中...`);
                setTimeout(() => cpuPlay(currentPlayer), 1000);
            } else {
                setMessage('あなたの番です。打牌する牌を選ぶか、手牌の場所を入れ替えられます。');
            }
        }

        function cpuPlay(cpu) {
            const agariResult = checkAgariLogic([...cpu.hand, cpu.tsumo]);
            if (agariResult) {
                setMessage(`🎉 ${cpu.name} がアガりました！`);
                isGameOver = true;
                updateUI();
                showMemorialModal(agariResult.words, agariResult.head, cpu.name);
                return;
            }

            const discardFromHand = Math.random() < 0.7;
            if (discardFromHand) {
                const idx = Math.floor(Math.random() * cpu.hand.length);
                const discarded = cpu.hand[idx];
                cpu.hand[idx] = cpu.tsumo;
                cpu.discards.push(discarded);
            } else {
                cpu.discards.push(cpu.tsumo);
            }
            cpu.tsumo = null;

            nextTurn();
        }

        function nextTurn() {
            turn = (turn + 1) % 4;
            startTurn();
        }

        // --- 🖐️ 手牌選択 & 手動入れ替えロジック ---
        function handleTileClick(index) {
            if (isGameOver) return;
            const p = players[0];

            // 1. ツモ牌が選択された状態で手牌をクリック -> ツモ牌と交換
            if (isTsumoSelected) {
                const temp = p.hand[index];
                p.hand[index] = p.tsumo;
                p.tsumo = temp;
                isTsumoSelected = false;
                selectedIndex = null;
                updateUI();
                return;
            }

            // 2. すでに手牌のどれかが選択されていて、別の手牌をクリック -> 2枚の位置を入れ替え
            if (selectedIndex !== null && selectedIndex !== index) {
                const temp = p.hand[selectedIndex];
                p.hand[selectedIndex] = p.hand[index];
                p.hand[index] = temp;
                selectedIndex = null;
                updateUI();
                return;
            }

            // 3. 選択の切替
            if (selectedIndex === index) {
                selectedIndex = null; // 解除
            } else {
                selectedIndex = index;
            }
            isTsumoSelected = false;
            updateUI();
        }

        function handleTsumoClick() {
            if (isGameOver) return;
            if (selectedIndex !== null) {
                // 手牌選択中にツモ牌をクリック -> 位置交換
                const p = players[0];
                const temp = p.hand[selectedIndex];
                p.hand[selectedIndex] = p.tsumo;
                p.tsumo = temp;
                selectedIndex = null;
                isTsumoSelected = false;
            } else {
                isTsumoSelected = !isTsumoSelected;
            }
            updateUI();
        }

        // --- 🖐️ ドラッグ＆ドロップ機能 ---
        function handleDragStart(e, index) {
            dragSourceIndex = index;
            e.dataTransfer.setData('text/plain', index);
        }

        function handleDragOver(e) {
            e.preventDefault(); // ドロップを許可
        }

        function handleDrop(e, targetIndex) {
            e.preventDefault();
            if (dragSourceIndex === null || dragSourceIndex === targetIndex) return;
            const p = players[0];
            const temp = p.hand[dragSourceIndex];
            p.hand[dragSourceIndex] = p.hand[targetIndex];
            p.hand[targetIndex] = temp;
            dragSourceIndex = null;
            selectedIndex = null;
            updateUI();
        }

        function discardSelected() {
            if (turn !== 0 || isGameOver) return;
            const p = players[0];

            if (isTsumoSelected) {
                p.discards.push(p.tsumo);
                p.tsumo = null;
            } else if (selectedIndex !== null) {
                p.discards.push(p.hand[selectedIndex]);
                p.hand[selectedIndex] = p.tsumo;
                p.tsumo = null;
            } else {
                setMessage('捨てる牌を選択してください！');
                return;
            }

            selectedIndex = null;
            isTsumoSelected = false;
            nextTurn();
        }

        function sortHand() {
            players[0].hand.sort((a, b) => HIRAGANA_LIST.indexOf(a) - HIRAGANA_LIST.indexOf(b));
            selectedIndex = null;
            updateUI();
        }

        function checkAgari(isManual = false) {
            const p = players[0];
            const allChars = [...p.hand];
            if (p.tsumo) allChars.push(p.tsumo);

            const result = checkAgariLogic(allChars);

            if (result) {
                setMessage(`🎉 アガリ！！ 完成言葉：${result.words.join(' / ')}`);
                isGameOver = true;
                showMemorialModal(result.words, result.head, 'あなた');
            } else if (isManual) {
                setMessage('❌ まだアガリの形（言葉＋言葉...＋同じ文字2枚）になっていません！');
            }
        }

        function checkAgariLogic(allChars) {
            if (allChars.length < 11) return null;

            const charCounts = {};
            allChars.forEach(c => charCounts[c] = (charCounts[c] || 0) + 1);

            const headCandidates = Object.keys(charCounts).filter(char => charCounts[char] >= 2);

            for (let head of headCandidates) {
                const tempCounts = { ...charCounts };
                tempCounts[head] -= 2;

                const words = findWords(tempCounts);
                if (words !== null) {
                    return { head, words };
                }
            }
            return null;
        }

        function findWords(counts) {
            const remainingCount = Object.values(counts).reduce((a, b) => a + b, 0);
            if (remainingCount === 0) return [];

            for (let word of DICTIONARY) {
                if (word.length > remainingCount) continue;

                let canForm = true;
                let tempMap = { ...counts };

                for (let char of word) {
                    if (!tempMap[char] || tempMap[char] <= 0) {
                        canForm = false;
                        break;
                    }
                    tempMap[char]--;
                }

                if (canForm) {
                    const subResult = findWords(tempMap);
                    if (subResult !== null) {
                        return [word, ...subResult];
                    }
                }
            }
            return null;
        }

        function updateUI() {
            document.getElementById('deck-count').innerText = deck.length;

            for (let i = 0; i < 4; i++) {
                const tagId = i === 0 ? 'tag-player' : `tag-cpu${i}`;
                const tagEl = document.getElementById(tagId);
                if (turn === i && !isGameOver) tagEl.classList.add('active');
                else tagEl.classList.remove('active');
            }

            [1, 2, 3].forEach(id => {
                const cpu = players[id];
                const cpuHandDiv = document.getElementById(`hand-cpu${id}`);
                cpuHandDiv.innerHTML = '';
                cpu.hand.forEach(() => {
                    const tile = document.createElement('div');
                    tile.className = 'tile back small';
                    cpuHandDiv.appendChild(tile);
                });
                if (cpu.tsumo) {
                    const tile = document.createElement('div');
                    tile.className = 'tile back small';
                    cpuHandDiv.appendChild(tile);
                }
            });

            // プレイヤー手牌（ドラッグ＆ドロップ ＆ クリック対応）
            const p = players[0];
            const pHandDiv = document.getElementById('hand-player');
            pHandDiv.innerHTML = '';
            p.hand.forEach((char, idx) => {
                const tile = document.createElement('div');
                tile.className = `tile ${selectedIndex === idx ? 'selected' : ''}`;
                tile.innerText = char;
                tile.draggable = true;
                tile.onclick = () => handleTileClick(idx);
                tile.ondragstart = (e) => handleDragStart(e, idx);
                tile.ondragover = (e) => handleDragOver(e);
                tile.ondrop = (e) => handleDrop(e, idx);
                pHandDiv.appendChild(tile);
            });

            const pTsumoDiv = document.getElementById('tsumo-player');
            pTsumoDiv.innerHTML = '';
            if (p.tsumo) {
                const tile = document.createElement('div');
                tile.className = `tile ${isTsumoSelected ? 'selected' : ''}`;
                tile.innerText = p.tsumo;
                tile.onclick = handleTsumoClick;
                pTsumoDiv.appendChild(tile);
            }

            players.forEach((player, idx) => {
                const targetId = idx === 0 ? 'discard-player' : `discard-cpu${idx}`;
                const zone = document.getElementById(targetId);
                zone.innerHTML = '';
                player.discards.forEach(char => {
                    const tile = document.createElement('div');
                    tile.className = 'tile small';
                    tile.innerText = char;
                    zone.appendChild(tile);
                });
            });

            document.getElementById('btn-discard').disabled = (turn !== 0 || p.tsumo === null || (selectedIndex === null && !isTsumoSelected) || isGameOver);
        }

        function setMessage(msg) {
            document.getElementById('message-box').innerText = msg;
        }

        // --- 🎨 仲間たちが肩を組んで大喜びしている記念イラスト生成 (Canvas) ---
        function showMemorialModal(words, head, winnerName) {
            const modal = document.getElementById('modal');
            document.getElementById('modal-title').innerText = `🎉 ${winnerName} の大勝利！`;
            modal.style.display = 'flex';

            const canvas = document.getElementById('memorial-canvas');
            const ctx = canvas.getContext('2d');

            // 1. 青空と青々とした野原の背景を描画
            const skyGrad = ctx.createLinearGradient(0, 0, 0, 300);
            skyGrad.addColorStop(0, '#74b9ff');
            skyGrad.addColorStop(1, '#dfe6e9');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, 640, 440);

            // 太陽と光
            ctx.fillStyle = '#ffeaa7';
            ctx.beginPath();
            ctx.arc(580, 60, 50, 0, Math.PI * 2);
            ctx.fill();

            // 虹の描画
            const rainbowColors = ['#ff7675', '#fdcb6e', '#55efc4', '#74b9ff', '#a29bfe'];
            rainbowColors.forEach((color, i) => {
                ctx.strokeStyle = color;
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.arc(320, 380, 280 - i * 7, Math.PI, 0, false);
                ctx.stroke();
            });

            // 緑の野原（地面）
            const hillGrad = ctx.createLinearGradient(0, 280, 0, 440);
            hillGrad.addColorStop(0, '#55efc4');
            hillGrad.addColorStop(1, '#00b894');
            ctx.fillStyle = hillGrad;
            ctx.beginPath();
            ctx.ellipse(320, 380, 380, 120, 0, 0, Math.PI * 2);
            ctx.fill();

            // 紙吹雪
            const confettiColors = ['#e74c3c', '#f1c40f', '#3498db', '#9b59b6', '#ffffff'];
            for (let i = 0; i < 40; i++) {
                ctx.fillStyle = confettiColors[i % confettiColors.length];
                ctx.beginPath();
                ctx.arc((i * 41) % 640, (i * 31) % 250, (i % 4) + 3, 0, Math.PI * 2);
                ctx.fill();
            }

            // 外枠
            ctx.strokeStyle = '#f39c12';
            ctx.lineWidth = 8;
            ctx.strokeRect(10, 10, 620, 420);

            // タイトル
            ctx.fillStyle = '#2c3e50';
            ctx.font = 'bold 24px "M PLUS Rounded 1c", sans-serif';
            ctx.textAlign = 'center';
            ctx.shadowColor = 'rgba(255,255,255,0.8)';
            ctx.shadowBlur = 4;
            ctx.fillText(`🏆 ${winnerName} のあがり記念カード 🏆`, 320, 45);

            // 2. 登場キャラクター（言葉）の決定
            const charList = words.map(w => CHARACTER_MAP[w] || { emoji: '✨', name: w, color: '#e74c3c', bodyColor: '#ff7675' });
            const count = charList.length;

            // キャラクターたちの配置計算
            const startX = 320 - (count - 1) * 90;
            const bodyY = 270;

            // --- ✨ 肩を組む腕（手をつなぐ曲線）を先に描画 ---
            if (count > 1) {
                ctx.strokeStyle = '#d35400';
                ctx.lineWidth = 12;
                ctx.lineCap = 'round';
                ctx.beginPath();
                for (let i = 0; i < count - 1; i++) {
                    const x1 = startX + i * 180;
                    const x2 = startX + (i + 1) * 180;
                    // 隣のキャラと肩を組みあう太いアームライン
                    ctx.moveTo(x1, bodyY - 10);
                    ctx.quadraticCurveTo((x1 + x2) / 2, bodyY - 35, x2, bodyY - 10);
                }
                ctx.stroke();

                // 袖/服のカラーライン
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 6;
                ctx.stroke();
            }

            // --- キャラクター本 __ 描画 ---
            charList.forEach((charInfo, i) => {
                const x = startX + i * 180;

                // 胴体（ポップな服）
                ctx.fillStyle = charInfo.bodyColor;
                ctx.beginPath();
                ctx.arc(x, bodyY + 30, 42, Math.PI, 0, false);
                ctx.fill();

                // 顔（丸い顔）
                ctx.fillStyle = '#ffeaa7';
                ctx.beginPath();
                ctx.arc(x, bodyY - 20, 48, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#fdcb6e';
                ctx.lineWidth = 3;
                ctx.stroke();

                // 笑顔の表情（にっこり目 ＆ 大口で笑う）
                ctx.strokeStyle = '#2c3e50';
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';

                // 左目 ^
                ctx.beginPath();
                ctx.arc(x - 18, bodyY - 28, 10, Math.PI * 1.1, Math.PI * 1.9);
                ctx.stroke();
                // 右目 ^
                ctx.beginPath();
                ctx.arc(x + 18, bodyY - 28, 10, Math.PI * 1.1, Math.PI * 1.9);
                ctx.stroke();

                // 口（笑う大口 ▽）
                ctx.fillStyle = '#e74c3c';
                ctx.beginPath();
                ctx.arc(x, bodyY - 15, 18, 0, Math.PI, false);
                ctx.fill();

                // ほっぺ（ピンクの丸）
                ctx.fillStyle = 'rgba(255, 118, 117, 0.6)';
                ctx.beginPath();
                ctx.arc(x - 28, bodyY - 12, 10, 0, Math.PI * 2);
                ctx.arc(x + 28, bodyY - 12, 10, 0, Math.PI * 2);
                ctx.fill();

                // キャラクターアイコン（頭の上の帽子風）
                ctx.font = '36px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(charInfo.emoji, x, bodyY - 75);

                // 胸元の言葉リボンバッジ（「さる」「きじ」「らいおん」など）
                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 4;
                ctx.beginPath();
                ctx.roundRect(x - 65, bodyY + 30, 130, 36, 12);
                ctx.fill();

                ctx.fillStyle = '#2c3e50';
                ctx.font = 'bold 20px "M PLUS Rounded 1c", sans-serif';
                ctx.shadowBlur = 0;
                ctx.fillText(charInfo.name, x, bodyY + 48);
            });

            // 3. アタマ（ペア）風船の描画
            const balloonX = 550;
            const balloonY = 120;

            ctx.fillStyle = '#2ecc71';
            ctx.beginPath();
            ctx.ellipse(balloonX, balloonY, 50, 40, 0, 0, Math.PI * 2);
            ctx.fill();

            // 紐
            ctx.strokeStyle = '#27ae60';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(balloonX, balloonY + 40);
            ctx.lineTo(balloonX - 10, balloonY + 90);
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 18px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(`ペア: ${head}${head}`, balloonX, balloonY);
        }

        function downloadCanvas() {
            const canvas = document.getElementById('memorial-canvas');
            const link = document.createElement('a');
            link.download = 'ひらがなドンジャラ_肩組み記念カード.png';
            link.href = canvas.toDataURL();
            link.click();
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }
    </script>
